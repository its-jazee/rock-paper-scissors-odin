<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Let's Play Rock Paper Scissors!</h1>
    <p>Pick your choice. You will be playing against the computer.</p>
    <div class="button-box">
        <button id="rockBtn">Rock</button>
        <button id="paperBtn">Paper</button>
        <button id="scissorBtn">Scissors</button>
    </div>
    <div id="pcChoice"></div>
    <h3>PC : <span id="pcScore">0</span> You : <span id="humanScore">0</span></h3>
    <h2 id="winner">The one to get to 5 first wins!</h2>
    <div id="reset"></div>
    <script src="script.js"></script>
</body>
</html>
